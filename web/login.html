<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ariniqo Buddies</title>
    <link rel="stylesheet" href="css/login-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <!-- Brand Header -->
        <div class="brand-header">
            <a href="index.html" class="brand-logo">
                <i class="fas fa-paw"></i>
                Ariniqo Buddies
            </a>
            <p class="brand-tagline">Pet Adoption Platform - Secure Login</p>
        </div>
        
        <!-- Login Form -->
        <div class="login-header">
            <h2><i class="fas fa-sign-in-alt"></i> Login</h2>
            <p>Select your role and enter your credentials</p>
        </div>
        
        <form id="loginForm">
            <!-- Role Selection -->
            <div class="role-selection">
                <label for="role">
                    <i class="fas fa-user-tag"></i> Select Role
                </label>
                <div class="role-options">
                    <div class="role-option admin selected" data-role="admin">
                        <i class="fas fa-user-shield"></i>
                        <span>Admin</span>
                    </div>
                    <div class="role-option user" data-role="user">
                        <i class="fas fa-user"></i>
                        <span>User</span>
                    </div>
                </div>
                <input type="hidden" id="role" name="role" value="admin" class="role-input">
            </div>
            
            <!-- Email -->
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> Email Address
                </label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
            </div>
            
            <!-- Password -->
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <div class="password-wrapper">
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <!-- Options -->
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="remember"> Remember me
                </label>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="btn-submit">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>
        
        <!-- Alternative Login -->
        <div class="social-divider">
            <span>Or continue with</span>
        </div>
        
        <div class="social-buttons">
            <button class="social-btn google">
                <i class="fab fa-google"></i> Google
            </button>
            <button class="social-btn facebook">
                <i class="fab fa-facebook"></i> Facebook
            </button>
        </div>
        
        <!-- Signup Link -->
        <div class="link-container">
            Need an account? <a href="signup.html">Create Account</a>
        </div>
    </div>
    
    <!-- Pet Decorations -->
    <div class="pet-decoration paw-1">
        <i class="fas fa-paw"></i>
    </div>
    <div class="pet-decoration paw-2">
        <i class="fas fa-paw"></i>
    </div>
    
    <script>
        // Role Selection
        document.querySelectorAll('.role-option').forEach(option => {
            option.addEventListener('click', function() {
                // Remove selected class from all options
                document.querySelectorAll('.role-option').forEach(opt => {
                    opt.classList.remove('selected');
                });
                
                // Add selected class to clicked option
                this.classList.add('selected');
                
                // Update hidden input value
                const role = this.getAttribute('data-role');
                document.getElementById('role').value = role;
            });
        });
        
        // Password toggle
        document.querySelector('.password-toggle').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
        
        // Form submission with role-based redirection
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const rememberMe = document.getElementById('remember').checked;
            
            // Validation
            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }
            
            // Show loading
            const submitBtn = document.querySelector('.btn-submit');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';
            submitBtn.disabled = true;
            
            // Clear any previous errors
            hideError();
            
            // Simulate authentication (replace with actual API call)
            setTimeout(() => {
                // For demo purposes - check some sample credentials
                const demoCredentials = {
                    'admin@ariniqobuddies.com': { password: 'admin123', role: 'admin' },
                    'user@ariniqobuddies.com': { password: 'user123', role: 'user' },
                    'admin': { password: 'admin', role: 'admin' },
                    'user': { password: 'user', role: 'user' }
                };
                
                const user = demoCredentials[email] || demoCredentials[email.toLowerCase()];
                
                if (user && user.password === password) {
                    // Save login info to localStorage
                    localStorage.setItem('userEmail', email);
                    localStorage.setItem('userRole', user.role);
                    localStorage.setItem('rememberMe', rememberMe);
                    
                    // Redirect based on selected role - NO POPUP
                    if (role === 'admin') {
                        window.location.href = 'admin/dashboard.html';
                    } else {
                        window.location.href = 'user/index.html';
                    }
                } else {
                    // Simple error message
                    showError('Invalid email or password');
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            }, 800); // Shorter delay
        });
        
        // Function to show error messages on the page
        function showError(message) {
            // Remove any existing error message
            hideError();
            
            // Create error message element
            const errorDiv = document.createElement('div');
            errorDiv.className = 'login-error';
            errorDiv.innerHTML = `
                <div style="background: rgba(255, 126, 95, 0.1); padding: 12px 15px; border-radius: 8px; border: 1px solid #ff7e5f; margin: 10px 0; display: flex; align-items: center; gap: 10px; color: #ff7e5f; font-size: 14px;">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>${message}</span>
                </div>
            `;
            
            // Insert error message before the submit button
            const form = document.getElementById('loginForm');
            const submitBtn = form.querySelector('.btn-submit');
            form.insertBefore(errorDiv, submitBtn);
            
            // Scroll to error
            errorDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        
        // Function to hide error messages
        function hideError() {
            const existingError = document.querySelector('.login-error');
            if (existingError) {
                existingError.remove();
            }
        }
        
        // Forgot password
        document.querySelector('.forgot-password').addEventListener('click', function(e) {
            e.preventDefault();
            const email = prompt('Enter your email to reset password:');
            if (email) {
                // Simple success message
                showSuccessMessage(`Password reset link sent to ${email}`);
            }
        });
        
        // Function to show success messages
        function showSuccessMessage(message) {
            // Remove any existing message
            const existingMessage = document.querySelector('.success-message');
            if (existingMessage) {
                existingMessage.remove();
            }
            
            // Create success message element
            const successDiv = document.createElement('div');
            successDiv.className = 'success-message';
            successDiv.innerHTML = `
                <div style="background: rgba(65, 216, 191, 0.1); padding: 12px 15px; border-radius: 8px; border: 1px solid #41d8bf; margin: 10px 0; display: flex; align-items: center; gap: 10px; color: #41d8bf; font-size: 14px;">
                    <i class="fas fa-check-circle"></i>
                    <span>${message}</span>
                </div>
            `;
            
            // Insert message before the form
            const form = document.getElementById('loginForm');
            form.parentNode.insertBefore(successDiv, form);
            
            // Auto-remove after 5 seconds
            setTimeout(() => {
                if (successDiv.parentNode) {
                    successDiv.style.opacity = '0';
                    successDiv.style.transition = 'opacity 0.5s';
                    setTimeout(() => successDiv.remove(), 500);
                }
            }, 5000);
        }
        
        // Auto-fill demo credentials on page load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const demo = urlParams.get('demo');
            
            if (demo === 'admin') {
                document.getElementById('email').value = 'admin@ariniqobuddies.com';
                document.getElementById('password').value = 'admin123';
            } else if (demo === 'user') {
                document.getElementById('email').value = 'user@ariniqobuddies.com';
                document.getElementById('password').value = 'user123';
                document.querySelector('.role-option.user').click();
            }
            
            // Check if user is already logged in
            const userEmail = localStorage.getItem('userEmail');
            const userRole = localStorage.getItem('userRole');
            const rememberMe = localStorage.getItem('rememberMe');
            
            if (userEmail && rememberMe === 'true') {
                document.getElementById('email').value = userEmail;
                document.getElementById('remember').checked = true;
                
                // Auto-select role if available
                if (userRole) {
                    if (userRole === 'admin') {
                        document.querySelector('.role-option.admin').click();
                    } else {
                        document.querySelector('.role-option.user').click();
                    }
                }
            }
        });
    </script>
</body>
</html>
