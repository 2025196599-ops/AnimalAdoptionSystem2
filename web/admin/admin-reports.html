<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Reports - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin-style.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar (same as dashboard) -->
        <aside class="admin-sidebar">
            <!-- Same sidebar content -->
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1><i class="fas fa-clipboard-list"></i> All Lost & Found Reports</h1>
                <div class="admin-actions">
                    <button class="btn-view" style="padding: 12px 20px;">
                        <i class="fas fa-plus"></i> New Report
                    </button>
                </div>
            </header>

            <!-- Advanced Filters -->
            <div class="admin-card" style="margin-bottom: 30px;">
                <h3><i class="fas fa-filter"></i> Filter Reports</h3>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px;">
                    <div>
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Report Type</label>
                        <select class="table-filter" style="width: 100%;">
                            <option value="all">All Types</option>
                            <option value="lost">Lost</option>
                            <option value="found">Found</option>
                        </select>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Status</label>
                        <select class="table-filter" style="width: 100%;">
                            <option value="all">All Status</option>
                            <option value="pending">Pending</option>
                            <option value="active">Active</option>
                            <option value="resolved">Resolved</option>
                        </select>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Date Range</label>
                        <select class="table-filter" style="width: 100%;">
                            <option value="today">Today</option>
                            <option value="week">This Week</option>
                            <option value="month">This Month</option>
                            <option value="all">All Time</option>
                        </select>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Pet Type</label>
                        <select class="table-filter" style="width: 100%;">
                            <option value="all">All Pets</option>
                            <option value="dog">Dogs</option>
                            <option value="cat">Cats</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button class="btn-submit">Apply Filters</button>
                    <button class="btn-cancel">Reset</button>
                </div>
            </div>

            <!-- Reports Table -->
            <div class="reports-table-container">
                <div class="table-header">
                    <h2><i class="fas fa-list"></i> All Reports (45)</h2>
                    <div class="table-actions">
                        <button class="btn-view">
                            <i class="fas fa-download"></i> Export CSV
                        </button>
                        <button class="btn-edit">
                            <i class="fas fa-print"></i> Print
                        </button>
                    </div>
                </div>

                <!-- Table content would be populated from database -->
                <div class="empty-state">
                    <i class="fas fa-clipboard"></i>
                    <h3>No Reports Found</h3>
                    <p>Try adjusting your filters or create a new report.</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
