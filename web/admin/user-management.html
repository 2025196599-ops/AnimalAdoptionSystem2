<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management</title>
    <link rel="stylesheet" href="../css/admin-style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-users"></i> User Management <span class="user-count" id="userCount">2 users</span></h1>
        <button class="btn btn-primary" onclick="showAddUserForm()">
            <i class="fas fa-user-plus"></i> Add New User
        </button>
        <br/><br/>
        
        <!-- User Table -->
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <!-- Users will be populated by JavaScript -->
            </tbody>
        </table>

        <!-- Add/Edit User Form (hidden by default) -->
        <div id="userFormContainer">
            <h3 id="formTitle"><i class="fas fa-user-plus"></i> Add New User</h3>
            <form id="userForm">
                <input type="hidden" id="userId" />
                
                <label for="userName"><i class="fas fa-user"></i> Name:</label><br/>
                <input type="text" id="userName" required placeholder="Enter full name" /><br/><br/>
                
                <label for="userEmail"><i class="fas fa-envelope"></i> Email:</label><br/>
                <input type="email" id="userEmail" required placeholder="Enter email address" /><br/><br/>
                
                <!-- Role is fixed as Admin -->
                <div class="role-display">
                    <i class="fas fa-user-shield"></i>
                    <span>Administrator</span>
                    <div class="role-badge">Full Access</div>
                </div>
                <br/>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Save User
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="hideUserForm()">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Sample users data
        let users = [
            { id: 1, name: "John Doe", email: "john@example.com" },
            { id: 2, name: "Jane Smith", email: "jane@example.com" }
        ];

        // Update user count
        function updateUserCount() {
            document.getElementById('userCount').textContent = users.length + ' user' + (users.length !== 1 ? 's' : '');
        }

        // Show Add User form
        function showAddUserForm() {
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-user-plus"></i> Add New User';
            document.getElementById('userFormContainer').style.display = 'block';
        }

        // Hide form
        function hideUserForm() {
            document.getElementById('userFormContainer').style.display = 'none';
        }

        // Populate table
        function populateTable() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';
            
            if (users.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            <i class="fas fa-users-slash"></i>
                            <p>No users found. Add your first user!</p>
                        </td>
                    </tr>
                `;
            } else {
                users.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td class="admin-role">
                            <i class="fas fa-user-shield"></i> Admin
                        </td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn btn-secondary" onclick="editUser(${user.id})">
                                    <i class="fas fa-edit"></i> Edit
                                </button>
                                <button class="btn btn-danger" onclick="deleteUser(${user.id})">
                                    <i class="fas fa-trash"></i> Delete
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }
            updateUserCount();
        }

        // Add or update user
        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('userId').value;
            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('userEmail').value.trim();

            if (!name || !email) {
                alert('Please fill in all fields');
                return;
            }

            if (id) {
                // Update existing user
                const user = users.find(u => u.id == id);
                if (user) {
                    user.name = name;
                    user.email = email;
                }
            } else {
                // Add new user
                const newId = users.length ? Math.max(...users.map(u => u.id)) + 1 : 1;
                users.push({ id: newId, name, email });
            }
            
            populateTable();
            hideUserForm();
            
            // Show success message
            alert(`User ${id ? 'updated' : 'added'} successfully!`);
        });

        // Edit user
        function editUser(id) {
            const user = users.find(u => u.id === id);
            if (user) {
                document.getElementById('userId').value = user.id;
                document.getElementById('userName').value = user.name;
                document.getElementById('userEmail').value = user.email;
                document.getElementById('formTitle').innerHTML = '<i class="fas fa-user-edit"></i> Edit User';
                document.getElementById('userFormContainer').style.display = 'block';
            }
        }

        // Delete user
        function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                users = users.filter(u => u.id !== id);
                populateTable();
            }
        }

        // Initialize table
        window.onload = populateTable;
    </script>
</body>
</html>
